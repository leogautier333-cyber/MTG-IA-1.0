name: Phase 1 - Discord test

on:
  workflow_dispatch:

jobs:
  discord-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Discord test dependency
        run: python -m pip install requests

      - name: Send test alert
        run: python -m services.phase_one_monitor --test-discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

permissions:
  contents: read
