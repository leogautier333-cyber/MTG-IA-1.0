name: Analyse quotidienne du stock

on:
  schedule:
    - cron: '0 7,19 * * *'
  workflow_dispatch:

concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install requests "psycopg[binary]>=3.2"

      - name: Analyze stock prices
        run: python -m services.phase_one_monitor --once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify failure on Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -fsS -H "Content-Type: application/json" \
              -d "{\"embeds\":[{\"title\":\"[PANNE] ${{ github.workflow }}\",\"description\":\"Le workflow a échoué. Détails : $RUN_URL\",\"color\":15158332}]}" \
              "$DISCORD_WEBHOOK_URL"
          fi

permissions:
  contents: read
