name: Sauvegarde chiffree de la base

on:
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install "psycopg[binary]>=3.2" cryptography

      - name: Create encrypted backup
        run: python -m database.backup create backup/mtg-backup.json.gz.enc
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: mtg-backup-${{ github.run_id }}
          path: backup/mtg-backup.json.gz.enc
          retention-days: 90
          if-no-files-found: error

      - name: Notify failure on Discord
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -fsS -H "Content-Type: application/json" \
              -d "{\"embeds\":[{\"title\":\"[PANNE] ${{ github.workflow }}\",\"description\":\"Le workflow a échoué. Détails : $RUN_URL\",\"color\":15158332}]}" \
              "$DISCORD_WEBHOOK_URL"
          fi

permissions:
  contents: read
